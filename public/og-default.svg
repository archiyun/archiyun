<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="150" r="200" fill="#e94560" opacity="0.08"/>
  <circle cx="150" cy="500" r="150" fill="#ff6b6b" opacity="0.06"/>
  <circle cx="600" cy="315" r="300" fill="#ffffff" opacity="0.02"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Title -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff">ARSENOVA</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#a0a0b8">个人博客 · 技术 · 生活 · 思考</text>
  <!-- Accent line -->
  <rect x="80" y="355" width="60" height="4" rx="2" fill="url(#accent)"/>
  <!-- Meta info -->
  <text x="80" y="420" font-family="monospace, sans-serif" font-size="20" fill="#606080">arsenova.xyz</text>
  <text x="80" y="460" font-family="monospace, sans-serif" font-size="20" fill="#606080">Nuxt / TypeScript / SSG</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
